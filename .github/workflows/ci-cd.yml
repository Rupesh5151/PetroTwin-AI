name: PETRO-TWIN AI — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend CI (React 19 + TypeScript + Vite)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend (React 19 / Vite / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript & Build Production Bundle
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: ML & Physics Engine CI (Python 3.12 / FastAPI)
  # -------------------------------------------------------------
  ml-physics-ci:
    name: ML & Physics Engine (Python 3.12 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml_service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_service/requirements.txt

      - name: Run Unified Physics & ML Test Suite
        run: python scripts/test_all.py

      - name: Verify FastAPI Microservice Boot & Health Check
        run: |
          python -c "
          from ml_service.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          res = client.get('/health')
          assert res.status_code == 200, f'Healthcheck failed: {res.text}'
          print('FastAPI Microservice Healthcheck Verified: 200 OK')
          "

  # -------------------------------------------------------------
  # Job 3: Spring Boot Enterprise Backend CI (Java 21 / Maven)
  # -------------------------------------------------------------
  backend-springboot-ci:
    name: Backend (Spring Boot 3.3 / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/springboot
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile and Run Unit Tests with Maven
        run: mvn clean test -B

  # -------------------------------------------------------------
  # Job 4: Docker Container Validation
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Container Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, ml-physics-ci, backend-springboot-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ML Service Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ml-service
          push: false
          load: false

      - name: Validate Spring Boot Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: false

  # -------------------------------------------------------------
  # Job 5: CD Deployment Status & Triggers
  # -------------------------------------------------------------
  deployment-status:
    name: Continuous Deployment Verification
    runs-on: ubuntu-latest
    needs: [docker-validation]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deployment Summary & Status Report
        run: |
          echo "=========================================================="
          echo "PETRO-TWIN AI: CI/CD PIPELINE PASSED SUCCESSFULLY!"
          echo "=========================================================="
          echo "Frontend:  Deployed to Vercel (https://sih-26120-petro-twin-ai.vercel.app)"
          echo "ML Engine: Deployed to Render (https://petrotwin-ml-service.onrender.com)"
          echo "Backend:   Deployed to Render (https://petrotwin-backend-5w7q.onrender.com)"
          echo "=========================================================="

      - name: Trigger Optional Render Deploy Hook (if secret configured)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated webhook deployment on Render..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
