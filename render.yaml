services:
  - type: web
    name: petrotwin-ml-service
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r ml_service/requirements.txt
    startCommand: uvicorn ml_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: petrotwin-backend
    env: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: ML_SERVICE_URL
        value: https://petrotwin-ml-service.onrender.com

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: petrotwin-db
          property: connectionString

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: petrotwin-db
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: petrotwin-db
          property: password

      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver

      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect

databases:
  - name: petrotwin-db
    plan: free
    region: oregon

