services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: petrotwin-postgres
    environment:
      POSTGRES_DB: petrotwin
      POSTGRES_USER: petro_user
      POSTGRES_PASSWORD: petro_password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/springboot/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petro_user -d petrotwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml-service
    container_name: petrotwin-ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  springboot:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: petrotwin-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petrotwin
      - SPRING_DATASOURCE_USERNAME=petro_user
      - SPRING_DATASOURCE_PASSWORD=petro_password123
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: petrotwin-frontend
    ports:
      - "3000:3000"
    depends_on:
      - springboot
      - ml-service
    restart: unless-stopped

volumes:
  pgdata:
